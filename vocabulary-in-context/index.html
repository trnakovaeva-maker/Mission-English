        let currentTextId = null;
        let draggedWord = null;

        document.getElementById('textChoice').addEventListener('change', function() {
            const textId = this.value;
            if (textId) {
                currentTextId = textId;
                loadExercise(textId);
            }
        });

        function loadExercise(textId) {
            const data = textsData[textId];
            const container = document.getElementById('exercise-container');
            
            // Process text with gaps
            let processedText = data.text;
            for (let i = 1; i <= data.answers.length; i++) {
                processedText = processedText.replace(`[${i}]`, 
                    `<span class="gap" data-index="${i-1}" data-answer="${data.answers[i-1]}"></span>`);
            }

            container.innerHTML = `
                <div class="section-title">${data.title}</div>
                
                <div class="instructions">
                    <strong>Instructions:</strong> Drag words from the word bank below and drop them into the gaps in the text. When you're done, click "Check Answers" to see your results.
                </div>
                
                <div class="text-display" id="textDisplay">
                    ${processedText}
                </div>

                <div class="section-title">Word Bank</div>
                <div class="word-bank" id="wordBank"></div>

                <div class="button-group">
                    <button onclick="checkAnswers()">Check Answers</button>
                    <button onclick="resetExercise()">Reset Exercise</button>
                </div>

                <div id="feedback" class="feedback"></div>

                <div class="comprehension-section">
                    <div class="section-title">Comprehension Questions</div>
                    
                    <div class="question">
                        <h4>1. ${data.questions[0].q}</h4>
                        <textarea id="q1" rows="4" placeholder="Write your answer here..."></textarea>
                        <button class="show-example-btn" onclick="toggleExample('ex1')">Show Example Answer</button>
                        <div id="ex1" class="example-answer">
                            <strong>Example B2 Answer:</strong>
                            ${data.questions[0].a}
                        </div>
                    </div>

                    <div class="question">
                        <h4>2. ${data.questions[1].q}</h4>
                        <textarea id="q2" rows="4" placeholder="Write your answer here..."></textarea>
                        <button class="show-example-btn" onclick="toggleExample('ex2')">Show Example Answer</button>
                        <div id="ex2" class="example-answer">
                            <strong>Example B2 Answer:</strong>
                            ${data.questions[1].a}
                        </div>
                    </div>
                </div>
            `;

            // Initialize word bank with shuffled words
            const wordBank = document.getElementById('wordBank');
            data.shuffled.forEach(word => {
                const wordDiv = document.createElement('div');
                wordDiv.className = 'word-option';
                wordDiv.textContent = word;
                wordDiv.draggable = true;
                wordDiv.addEventListener('dragstart', handleDragStart);
                wordDiv.addEventListener('dragend', handleDragEnd);
                wordBank.appendChild(wordDiv);
            });

            // Add drag event listeners to gaps
            const gaps = document.querySelectorAll('.gap');
            gaps.forEach(gap => {
                gap.addEventListener('dragover', handleDragOver);
                gap.addEventListener('drop', handleDrop);
                gap.addEventListener('dragleave', handleDragLeave);
            });

            // Scroll to exercise
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function handleDragStart(e) {
            draggedWord = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.target.innerHTML);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            e.target.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) {
            e.target.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.preventDefault();

            e.target.classList.remove('drag-over');
            
            if (draggedWord && e.target.classList.contains('gap')) {
                e.target.textContent = draggedWord.textContent;
                e.target.classList.add('filled');
                draggedWord.classList.add('used');
            }

            return false;
        }

        function checkAnswers() {
            const gaps = document.querySelectorAll('.gap');
            let correct = 0;
            let total = gaps.length;

            gaps.forEach(gap => {
                const userAnswer = gap.textContent.trim().toLowerCase();
                const correctAnswer = gap.dataset.answer.toLowerCase();
                
                gap.classList.remove('correct', 'incorrect');
                
                if (userAnswer === correctAnswer) {
                    gap.classList.add('correct');
                    correct++;
                } else if (userAnswer !== '') {
                    gap.classList.add('incorrect');
                }
            });

            const feedback = document.getElementById('feedback');
            feedback.classList.add('show');
            
            if (correct === total) {
                feedback.className = 'feedback show success';
                feedback.innerHTML = `<div>🎉 Perfect! All answers are correct!</div><div class="score">${correct}/${total}</div>`;
            } else {
                feedback.className = 'feedback show partial';
                feedback.innerHTML = `<div>Good effort! Review the incorrect answers and try again.</div><div class="score">${correct}/${total} correct</div>`;
            }

            // Scroll to feedback
            feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function resetExercise() {
            if (!currentTextId) return;
            
            // Clear all gaps
            const gaps = document.querySelectorAll('.gap');
            gaps.forEach(gap => {
                gap.textContent = '';
                gap.classList.remove('filled', 'correct', 'incorrect');
            });

            // Reset word bank
            const wordBank = document.getElementById('wordBank');
            wordBank.innerHTML = '';
            
            const data = textsData[currentTextId];
            data.shuffled.forEach(word => {
                const wordDiv = document.createElement('div');
                wordDiv.className = 'word-option';
                wordDiv.textContent = word;
                wordDiv.draggable = true;
                wordDiv.addEventListener('dragstart', handleDragStart);
                wordDiv.addEventListener('dragend', handleDragEnd);
                wordBank.appendChild(wordDiv);
            });

            // Hide feedback
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('show');
        }

        function toggleExample(exampleId) {
            const example = document.getElementById(exampleId);
            example.classList.toggle('visible');
        }
    </script>
